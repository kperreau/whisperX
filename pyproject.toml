[project]
urls = { repository = "https://github.com/kperreau/whisperX" }
authors = [{ name = "Max Bain" }]
name = "whisperx"
version = "3.11.4"
description = "Time-Accurate Automatic Speech Recognition using Whisper."
readme = "README.md"
requires-python = ">=3.12, <3.16"
license = { text = "BSD-2-Clause" }
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

dependencies = [
    "ctranslate2>=4.8.3,<5",
    "faster-whisper>=1.2.1,<2",
    "nltk>=3.10.4,<4",
    "numpy>=2.5.4,<3",
    "omegaconf>=2.4.0,<3",
    "onnxruntime>=1.31.0,<2; python_version >= '3.15'",
    "pandas>=3.1.0,<4",
    "pyannote-audio>=4.0.7,<5",
    "huggingface-hub>=2.2.0,<3",
    "torch>=2.11,<3; python_version < '3.15'",
    "torch>=2.14.1,<3; python_version >= '3.15'",
    "torchvision>=0.26,<1; python_version < '3.15'",
    "torchvision>=0.29.1,<1; python_version >= '3.15'",
    "torchcodec>=0.11.1,<1; (sys_platform == 'linux' and platform_machine == 'x86_64') or sys_platform == 'darwin' or sys_platform == 'win32'",
    "transformers>=5.20.2,<6",
]


[project.optional-dependencies]
dev = ["pytest>=9.1.1,<10"]
align-torch = ["torchaudio>=2.11,<3"]
profile = ["py-spy>=0.4", "scalene>=1.5"]

[project.scripts]
whisperx = "whisperx.__main__:cli"

[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "crates/whisperx_ext/Cargo.toml"
module-name = "whisperx_ext"
python-packages = ["whisperx"]
exclude = ["crates/whisperx_ext/target/**/*"]

# torchcodec (transitive dep of pyannote-audio >=4) has no wheels for Linux aarch64
[tool.uv]
required-version = ">=0.13.5"
environments = [
    "python_version < '3.15' and (sys_platform == 'linux' or sys_platform == 'darwin' or sys_platform == 'win32')",
    "python_version >= '3.15' and sys_platform == 'linux' and platform_machine == 'x86_64'",
    "python_version >= '3.15' and sys_platform == 'darwin' and platform_machine == 'arm64'",
]
override-dependencies = [
    "torchcodec>=0.11.1,<1; (sys_platform == 'linux' and platform_machine == 'x86_64') or sys_platform == 'darwin' or sys_platform == 'win32'",
]

# CPython 3.15 wheels for the PyTorch family are distributed on its official index.
[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch", marker = "python_version >= '3.15'" }]
torchvision = [{ index = "pytorch", marker = "python_version >= '3.15'" }]
torchcodec = [{ index = "pytorch", marker = "python_version >= '3.15'" }]
ctranslate2 = [
    { url = "https://github.com/kperreau/whisperX/releases/download/python315-native-20261022/ctranslate2-4.8.3-cp315-cp315-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl", marker = "python_version >= '3.15' and sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { url = "https://github.com/kperreau/whisperX/releases/download/python315-native-20261022/ctranslate2-4.8.3-cp315-cp315-macosx_14_0_arm64.whl", marker = "python_version >= '3.15' and sys_platform == 'darwin' and platform_machine == 'arm64'" },
]
onnxruntime = [
    { url = "https://github.com/kperreau/whisperX/releases/download/python315-native-20261022/onnxruntime-1.31.0-cp315-cp315-manylinux_2_28_x86_64.whl", marker = "python_version >= '3.15' and sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { url = "https://github.com/kperreau/whisperX/releases/download/python315-native-20261022/onnxruntime-1.31.0-cp315-cp315-macosx_14_0_arm64.whl", marker = "python_version >= '3.15' and sys_platform == 'darwin' and platform_machine == 'arm64'" },
]
torchaudio = [
    { url = "https://github.com/kperreau/whisperX/releases/download/python315-native-20261022/torchaudio-2.11.0-cp315-cp315-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl", marker = "python_version >= '3.15' and sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { url = "https://github.com/kperreau/whisperX/releases/download/python315-native-20261022/torchaudio-2.11.0-cp315-cp315-macosx_14_0_arm64.whl", marker = "python_version >= '3.15' and sys_platform == 'darwin' and platform_machine == 'arm64'" },
]
