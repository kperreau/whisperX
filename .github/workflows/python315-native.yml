name: Python 3.15 native dependencies

on:
  pull_request:
    paths:
      - tools/build_python315_native.py
      - tools/build_python315_macos.py
      - .github/workflows/python315-native.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.package }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        package: [ctranslate2, onnxruntime, torchaudio]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: runner.os == 'macOS'
        with:
          python-version: '3.15'
      - name: Build macOS wheel
        if: runner.os == 'macOS'
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          python -m venv /tmp/native-venv
          /tmp/native-venv/bin/python tools/build_python315_native.py "$PACKAGE" --work-dir /tmp/native-build --output-dir dist --jobs 3
      - name: Build manylinux wheel
        if: runner.os == 'Linux'
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          docker run --rm -v "$PWD:/io" -w /io -e PACKAGE quay.io/pypa/manylinux_2_28_x86_64 bash -euxo pipefail -c '
            dnf upgrade -y ca-certificates
            if [ "$PACKAGE" = ctranslate2 ]; then
              dnf install -y dnf-plugins-core openblas-devel
              dnf config-manager --add-repo https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/cuda-rhel8.repo
              dnf install -y cuda-nvcc-12-8-12.8.93-1 cuda-cudart-devel-12-8-12.8.90-1 libcurand-devel-12-8-10.3.9.90-1 libcublas-devel-12-8-12.8.4.1-1
              export PATH="/usr/local/cuda-12.8/bin:$PATH"
              export CUDACXX=/usr/local/cuda-12.8/bin/nvcc
              export CUDA_TOOLKIT_ROOT_DIR=/usr/local/cuda-12.8
            fi
            /opt/python/cp315-cp315/bin/python -m venv /tmp/native-venv
            /tmp/native-venv/bin/python tools/build_python315_native.py "$PACKAGE" --work-dir /tmp/native-build --output-dir /io/dist --jobs 3
          '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native315-${{ matrix.package }}-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure() && runner.os == 'macOS'
        with:
          name: native315-logs-${{ matrix.package }}-${{ matrix.os }}
          path: /tmp/native-build/build/Release/CMakeFiles/CMakeConfigureLog.yaml

  inference:
    name: Python 3.15 CPU inference (${{ matrix.os }})
    needs: native
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.15'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: native315-*-${{ matrix.os }}
          path: dist
          merge-multiple: true
      - name: Install FFmpeg
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install the native wheels and project
        run: |
          python -m venv .venv315
          .venv315/bin/python -m pip install --upgrade 'pip>=26.2.2' 'certifi>=2026.10.19'
          .venv315/bin/python -m pip install dist/*.whl torch==2.14.1 torchvision==0.29.1 torchcodec==0.17.0 --extra-index-url https://download.pytorch.org/whl/cpu
          # Prove compatibility before widening the published Python constraint.
          python - <<'PY'
          from pathlib import Path
          p = Path('pyproject.toml')
          p.write_text(p.read_text().replace('>=3.12, <3.15', '>=3.12, <3.16'))
          PY
          .venv315/bin/python -m pip install '.[dev]'
          .venv315/bin/python -m pip check
      - name: Run the tests and real audio inference
        run: |
          .venv315/bin/python -m pytest tests/ -q
          .venv315/bin/python tools/check_inference.py --output evidence/cpu.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: inference315-${{ matrix.os }}
          path: evidence/*.json
          if-no-files-found: error
