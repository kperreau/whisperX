name: Python 3.15 native dependencies

on:
  workflow_dispatch:
    inputs:
      native_run_id:
        description: 'Reuse native wheels from this completed workflow run (empty = rebuild)'
        type: string
        required: false
      reuse_native_run_id:
        description: 'Reuse successful package builds from this run; build missing packages'
        type: string
        required: false
      package:
        description: 'Package to build'
        type: choice
        default: all
        options: [all, ctranslate2, onnxruntime, torchaudio]
      platform:
        description: 'Build platform'
        type: choice
        default: all
        options: [all, linux, macos]

permissions:
  contents: read
  actions: read

jobs:
  native:
    if: ${{ !inputs.native_run_id }}
    name: ${{ matrix.package }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'linux' && '["ubuntu-latest"]' || inputs.platform == 'macos' && '["macos-14"]' || '["ubuntu-latest", "macos-14"]') }}
        package: ${{ fromJSON(inputs.package && inputs.package != 'all' && format('["{0}"]', inputs.package) || '["ctranslate2", "onnxruntime", "torchaudio"]') }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: runner.os == 'macOS'
        with:
          python-version: '3.15'
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        id: wheels
        with:
          path: dist
          key: native315-${{ matrix.os }}-${{ matrix.package }}-${{ hashFiles('tools/build_python315_native.py', 'tools/build_python315_macos.py', 'tools/repair_python315_notices.py', '.github/workflows/python315-native.yml') }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        id: reused
        if: inputs.reuse_native_run_id && steps.wheels.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          name: native315-${{ matrix.package }}-${{ matrix.os }}
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ inputs.reuse_native_run_id }}
      - name: Verify reused wheel provenance
        if: steps.reused.outcome == 'success'
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, sys
          sys.path.insert(0, 'tools')
          from build_python315_macos import SOURCES
          for manifest in pathlib.Path('dist').glob('*-build.json'):
              data = json.loads(manifest.read_text())
              assert {k: tuple(v) for k, v in data['sources'].items()} == SOURCES
              wheel = manifest.parent / data['wheel']
              assert hashlib.sha256(wheel.read_bytes()).hexdigest() == data['sha256']
          PY
      - name: Build macOS wheel
        if: runner.os == 'macOS' && steps.wheels.outputs.cache-hit != 'true' && steps.reused.outcome != 'success'
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          python -m venv /tmp/native-venv
          /tmp/native-venv/bin/python tools/build_python315_native.py "$PACKAGE" --work-dir /tmp/native-build --output-dir dist --jobs 3
      - name: Build manylinux wheel
        if: runner.os == 'Linux' && steps.wheels.outputs.cache-hit != 'true' && steps.reused.outcome != 'success'
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          docker run --rm -v "$PWD:/io" -w /io -e PACKAGE quay.io/pypa/manylinux_2_28_x86_64 bash -euxo pipefail -c '
            dnf upgrade -y ca-certificates
            if [ "$PACKAGE" = ctranslate2 ]; then
              dnf install -y openblas-devel
            fi
            /opt/python/cp315-cp315/bin/python -m venv /tmp/native-venv
            /tmp/native-venv/bin/python tools/build_python315_native.py "$PACKAGE" --work-dir /tmp/native-build --output-dir /io/dist --jobs 3
          '
      - name: Include bundled numerical library licenses
        if: runner.os == 'Linux' && matrix.package == 'ctranslate2'
        run: python3 tools/repair_python315_notices.py dist/ctranslate2-build.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native315-${{ matrix.package }}-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure() && runner.os == 'macOS'
        with:
          name: native315-logs-${{ matrix.package }}-${{ matrix.os }}
          path: /tmp/native-build/build/Release/CMakeFiles/CMakeConfigureLog.yaml

  inference:
    name: Python 3.15 CPU inference (${{ matrix.os }})
    needs: native
    if: ${{ always() && (needs.native.result == 'success' || inputs.native_run_id) && (!inputs.package || inputs.package == 'all') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'linux' && '["ubuntu-latest"]' || inputs.platform == 'macos' && '["macos-14"]' || '["ubuntu-latest", "macos-14"]') }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.15'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: native315-*-${{ matrix.os }}
          path: dist
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ inputs.native_run_id || github.run_id }}
      - name: Install FFmpeg
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install the native wheels and project
        run: |
          python -m venv .venv315
          .venv315/bin/python -m pip install --upgrade 'pip>=26.2.2' 'certifi>=2026.10.19'
          .venv315/bin/python -m pip install dist/*.whl torch==2.14.1 torchvision==0.29.1 torchcodec==0.17.0 --extra-index-url https://download.pytorch.org/whl/cpu
          .venv315/bin/python -m pip install '.[dev]' --extra-index-url https://download.pytorch.org/whl/cpu
          .venv315/bin/python -m pip check
      - name: Run the tests and real audio inference
        run: |
          .venv315/bin/python -m pytest tests/ -q
          .venv315/bin/python tools/check_inference.py --output evidence/cpu.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: inference315-${{ matrix.os }}
          path: evidence/*.json
          if-no-files-found: error
