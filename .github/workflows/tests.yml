name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      UV_PYTHON_DOWNLOADS: never
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
        os: [ubuntu-latest, macos-14]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.13.5"

      - name: Install the project
        run: uv sync --locked --extra dev

      - name: Run tests
        run: uv run --locked --extra dev pytest tests/ -v

      - name: Install FFmpeg for speech validation
        if: matrix.python-version == '3.15' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install FFmpeg for speech validation
        if: matrix.python-version == '3.15' && runner.os == 'macOS'
        run: command -v ffmpeg || brew install ffmpeg

      - name: Validate CPU inference with real speech
        if: matrix.python-version == '3.15'
        run: |
          for vad_method in silero pyannote; do
            uv run --locked --extra dev python tools/check_inference.py --vad-method "$vad_method" --output "evidence/cpu-$vad_method.json"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.python-version == '3.15'
        with:
          name: python315-cpu-${{ matrix.os }}
          path: evidence/*.json
          if-no-files-found: error
          retention-days: 1
