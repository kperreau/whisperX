name: Build wheels

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x86_64:
    name: linux-x86_64 (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build manylinux wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: x86_64-unknown-linux-gnu
          manylinux: "2_28"
          args: --release --out dist --interpreter python${{ matrix.python-version }}
          # maturin reads pyproject.toml at the repo root, which points at
          # crates/whisperx_ext/Cargo.toml via [tool.maturin].

      - name: Smoke-test the wheel
        # numpy may lack wheels for very recent Python versions, in which case
        # a sdist+compile would push CI well past its time budget. Skip the
        # smoke test there — `cargo check` + the maturin compile already prove
        # the extension is well-formed.
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy || { echo "numpy unavailable for this interpreter — skipping import test"; exit 0; }
          python -m pip install --force-reinstall --no-deps dist/whisperx-*.whl
          python -c "from whisperx_ext.alignment import align_segment; print('import ok')"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel-linux-x86_64-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error

  macos-arm64:
    name: macos-arm64 (py${{ matrix.python-version }})
    runs-on: macos-14  # Apple Silicon runner
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build macOS arm64 wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: aarch64-apple-darwin
          args: --release --out dist --interpreter python${{ matrix.python-version }}

      - name: Smoke-test the wheel
        # numpy may lack wheels for very recent Python versions, in which case
        # a sdist+compile would push CI well past its time budget. Skip the
        # smoke test there — `cargo check` + the maturin compile already prove
        # the extension is well-formed.
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy || { echo "numpy unavailable for this interpreter — skipping import test"; exit 0; }
          python -m pip install --force-reinstall --no-deps dist/whisperx-*.whl
          python -c "from whisperx_ext.alignment import align_segment; print('import ok')"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel-macos-arm64-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error

  release:
    name: Attach wheels to GitHub Release
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-x86_64, macos-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: List wheels
        run: ls -lh dist

      - name: Create / update Release and upload wheels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.whl --clobber
          else
            gh release create "$RELEASE_TAG" dist/*.whl --title "$RELEASE_TAG" --generate-notes --verify-tag
          fi
