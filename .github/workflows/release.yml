name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (semver part to increment)"
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
      dry_run:
        description: "Dry run — compute the next version, build the wheels, but skip the commit / tag / release publish"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bump:
    name: Bump version + tag
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.compute.outputs.new_version }}
      tag: ${{ steps.compute.outputs.tag }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.13.5"

      - name: Compute next version
        id: compute
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          current=$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          IFS=. read -r MAJ MIN PAT <<<"$current"
          case "$BUMP" in
            patch) PAT=$((PAT + 1));;
            minor) MIN=$((MIN + 1)); PAT=0;;
            major) MAJ=$((MAJ + 1)); MIN=0; PAT=0;;
            *)     echo "unknown bump kind: $BUMP"; exit 1;;
          esac
          new="${MAJ}.${MIN}.${PAT}"
          echo "current=$current"
          echo "new=$new"
          echo "new_version=$new" >> "$GITHUB_OUTPUT"
          echo "tag=v$new"        >> "$GITHUB_OUTPUT"

      - name: Update pyproject.toml + uv.lock
        env:
          NEW_VERSION: ${{ steps.compute.outputs.new_version }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, pathlib, re
          new = os.environ["NEW_VERSION"]
          p = pathlib.Path("pyproject.toml")
          s = p.read_text()
          s2, n = re.subn(r'^version\s*=\s*".+"', f'version = "{new}"', s, count=1, flags=re.M)
          assert n == 1, "could not find version line in pyproject.toml"
          p.write_text(s2)
          PY
          # Refresh the lockfile so [tool.uv] consumers see the bump.
          uv lock

      - name: Commit, tag, push
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.compute.outputs.tag }}
          RELEASE_BRANCH: ${{ github.ref_name }}
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock
          git commit -m "chore: release $RELEASE_TAG"
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git push origin "HEAD:$RELEASE_BRANCH"
          git push origin "$RELEASE_TAG"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Dry-run summary
        env:
          RELEASE_TAG: ${{ steps.compute.outputs.tag }}
        if: ${{ inputs.dry_run }}
        run: |
          echo "::notice::Dry run — would tag $RELEASE_TAG on $(git rev-parse HEAD)"

  linux-x86_64:
    name: Build linux-x86_64 (py${{ matrix.python-version }})
    needs: bump
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # When dry-running there is no tag yet; build from the workflow ref.
          ref: ${{ inputs.dry_run && github.ref || needs.bump.outputs.tag }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build manylinux wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: x86_64-unknown-linux-gnu
          manylinux: "2_28"
          args: --release --out dist --interpreter python${{ matrix.python-version }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel-linux-x86_64-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error

  macos-arm64:
    name: Build macos-arm64 (py${{ matrix.python-version }})
    needs: bump
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.dry_run && github.ref || needs.bump.outputs.tag }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build macOS arm64 wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: aarch64-apple-darwin
          args: --release --out dist --interpreter python${{ matrix.python-version }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel-macos-arm64-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: ${{ !inputs.dry_run }}
    needs: [bump, linux-x86_64, macos-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: List wheels
        run: ls -lh dist

      - name: Create Release and upload wheels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.bump.outputs.tag }}
          RELEASE_SHA: ${{ needs.bump.outputs.sha }}
        run: gh release create "$RELEASE_TAG" dist/*.whl --title "$RELEASE_TAG" --target "$RELEASE_SHA" --generate-notes
